rules:
  - id: os-system-call
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)
    message: >-
      os.system/os.popen call. Flagged unconditionally (not taint-traced) --
      if the argument is built from any external input (concatenation,
      f-string, .format(), user/request data), this is command injection.
      Safe if the command string is fully hardcoded with no dynamic parts.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"

  - id: open-dynamic-path
    patterns:
      - pattern-either:
          - pattern: open($X + $Y, ...)
          - pattern: open(f"...{$VAR}...", ...)
          - pattern: |
              $PATH = $X + $Y
              ...
              open($PATH, ...)
          - pattern: |
              $PATH = f"...{$VAR}..."
              ...
              open($PATH, ...)
          - pattern: |
              $PATH = $X + $Y
              ...
              with open($PATH, ...) as $F:
                  ...
          - pattern: |
              $PATH = f"...{$VAR}..."
              ...
              with open($PATH, ...) as $F:
                  ...
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-not: '"..."'
    message: >-
      File path built via string concatenation or f-string, then passed to
      open(). Flagged unconditionally -- if any part comes from external
      input, this is path traversal (e.g. "../../etc/passwd"). Prefer
      os.path.join with os.path.basename() applied to the untrusted
      component, or an explicit allowlist check.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-22: Path Traversal"

  - id: sql-query-string-building
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute("..." + $VAR, ...)
          - pattern: $CURSOR.execute($VAR + "...", ...)
          - pattern: $CURSOR.execute(f"...{$VAR}...", ...)
          - pattern: $CURSOR.execute("..." % $VAR, ...)
          - pattern: $CURSOR.execute("...".format(...), ...)
          - pattern: |
              $QUERY = "..." + $VAR
              ...
              $CURSOR.execute($QUERY, ...)
          - pattern: |
              $QUERY = $VAR + "..."
              ...
              $CURSOR.execute($QUERY, ...)
          - pattern: |
              $QUERY = f"...{$VAR}..."
              ...
              $CURSOR.execute($QUERY, ...)
    message: >-
      SQL query string built via concatenation, f-string, %, or .format()
      rather than passed as separate parameters. Flagged unconditionally --
      this is SQL injection if any part is externally influenced. Use
      parameterized queries: cursor.execute("... WHERE x = %s", (value,))
      instead of building the query string yourself.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"

  - id: pickle-deserialize
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
    message: >-
      pickle.loads/load deserializes arbitrary Python objects and can execute
      code. Flagged unconditionally. Prefer json or a constrained serializer.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"

  - id: yaml-unsafe-load
    patterns:
      - pattern-either:
          - pattern: yaml.load($SRC)
          - pattern: yaml.load($SRC, Loader=yaml.Loader)
          - pattern: yaml.load($SRC, Loader=yaml.UnsafeLoader)
          - pattern: yaml.load($SRC, Loader=yaml.FullLoader)
    message: >-
      yaml.load without a SafeLoader can construct arbitrary Python objects.
      Use yaml.safe_load or Loader=yaml.SafeLoader.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"

  - id: eval-exec
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    message: >-
      eval/exec on attacker-controlled input is code injection. Flagged
      unconditionally. Prefer ast.literal_eval or a real parser.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"

  - id: subprocess-shell-true
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
    message: >-
      subprocess invoked with shell=True. Flagged unconditionally -- if the
      command string is built from external input this is command injection.
      Pass a list of arguments instead.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"

  - id: url-string-concat
    patterns:
      - pattern-either:
          - pattern: requests.get($X + $Y, ...)
          - pattern: requests.post($X + $Y, ...)
          - pattern: requests.put($X + $Y, ...)
          - pattern: requests.delete($X + $Y, ...)
          - pattern: requests.get(f"...{$VAR}...", ...)
          - pattern: requests.post(f"...{$VAR}...", ...)
          - pattern: urllib.request.urlopen($X + $Y, ...)
          - pattern: urllib.request.urlopen(f"...{$VAR}...", ...)
          - pattern: urlopen($X + $Y, ...)
          - pattern: urlopen(f"...{$VAR}...", ...)
    message: >-
      HTTP URL built via concatenation or f-string. Flagged unconditionally --
      if any part is externally influenced this can become SSRF. Prefer a
      hardcoded origin plus params= / a URL builder with an allowlist.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"