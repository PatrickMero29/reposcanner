[project]
name = "vulnscan"
version = "0.2.0"
description = "Multi-language vulnerability scanner: Semgrep pre-filter + a locally-trained classifier. No paid API."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "duckdb>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24",
]
semgrep = [
    "semgrep>=1.70.0",
]
ml = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "scikit-learn>=1.4.0",
    "accelerate>=0.30.0",
    "numpy>=1.24",
]

[project.scripts]
vulnscan = "vulnscan.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
